[project]
name = "py3d-modeler"
version = "1.0.0"
description = "Polygonal 3D modeler built with Python, PySide6, and OpenGL 3.3 Core"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "PyOpenGL>=3.1.7",
    "numpy>=1.26.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
